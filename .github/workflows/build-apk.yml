name: Build SuperJet Staff v3.8.9 Dual Confirmation Booking Sync

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Android source
        uses: actions/checkout@v4
      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Build APK and unit-test task
        run: gradle :app:assembleDebug :app:testDebugUnitTest --no-daemon
      - name: Rename and verify APK
        run: |
          APK="SuperJet_Staff_v3.8.9_DUAL_CONFIRMATION_BOOKING_SYNC.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$APK"
          SIGNER="$(find "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$SIGNER"
          "$SIGNER" verify --verbose "$APK"
          unzip -t "$APK" >/dev/null
      - name: Package matching Android source
        run: |
          zip -r SuperJet_Staff_v3.8.9_ANDROID_SOURCE.zip . -x ".git/*" -x "app/build/*" -x ".gradle/*"
      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SuperJet_Staff_v3.8.9_DUAL_CONFIRMATION_BOOKING_SYNC-${{ github.run_number }}
          path: |
            SuperJet_Staff_v3.8.9_DUAL_CONFIRMATION_BOOKING_SYNC.apk
            SuperJet_Staff_v3.8.9_ANDROID_SOURCE.zip
      - name: Publish APK release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v3.8.9-dual-confirmation-booking-sync-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG"             SuperJet_Staff_v3.8.9_DUAL_CONFIRMATION_BOOKING_SYNC.apk             SuperJet_Staff_v3.8.9_ANDROID_SOURCE.zip             --title "SuperJet Staff v3.8.9 Dual Confirmation Booking Sync (build ${GITHUB_RUN_NUMBER})"             --notes "Android update: explicit first/second live booking confirmation; safe reconciliation for a booking already completed in the official website; booking search by customer mobile or booking/operation code; forced dark dialogs and readable input contrast; no invented guest-code fallback; authenticated proof-image fast view retained."             --latest
