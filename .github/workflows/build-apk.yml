name: Build SuperJet Staff v3.8.5 Full Integrated

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Android source
        uses: actions/checkout@v4
      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Build Android APK and unit-test task
        run: gradle :app:assembleDebug :app:testDebugUnitTest --no-daemon
      - name: Rename and verify APK
        run: |
          APK="SuperJet_Staff_v3.8.5_FULL_INTEGRATED.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$APK"
          SIGNER="$(find "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$SIGNER"
          "$SIGNER" verify --verbose "$APK"
          unzip -t "$APK" >/dev/null
      - name: Package Android source
        run: |
          zip -r SuperJet_Staff_v3.8.5_ANDROID_SOURCE.zip . -x ".git/*" -x "app/build/*" -x ".gradle/*"
      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SuperJet_Staff_v3.8.5_FULL_INTEGRATED-${{ github.run_number }}
          path: |
            SuperJet_Staff_v3.8.5_FULL_INTEGRATED.apk
            SuperJet_Staff_v3.8.5_ANDROID_SOURCE.zip
      - name: Publish APK release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v3.8.5-full-integrated-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG"             SuperJet_Staff_v3.8.5_FULL_INTEGRATED.apk             SuperJet_Staff_v3.8.5_ANDROID_SOURCE.zip             --title "SuperJet Staff v3.8.5 Full Integrated (build ${GITHUB_RUN_NUMBER})"             --notes "Fresh Android build using the provider-aware payment notification parser and manager-only operational statistics. The full Windows project package is distributed separately; deploy its matching server source for manager statistics."             --latest
