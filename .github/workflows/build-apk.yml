name: Build SuperJet Staff v3.8.6 Full Project Final

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Android source
        uses: actions/checkout@v4
      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Build APK and unit-test task
        run: gradle :app:assembleDebug :app:testDebugUnitTest --no-daemon
      - name: Rename and verify APK
        run: |
          APK="SuperJet_Staff_v3.8.6_FULL_PROJECT_FINAL.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$APK"
          SIGNER="$(find "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$SIGNER"
          "$SIGNER" verify --verbose "$APK"
          unzip -t "$APK" >/dev/null
      - name: Package matching Android source
        run: |
          zip -r SuperJet_Staff_v3.8.6_ANDROID_SOURCE.zip . -x ".git/*" -x "app/build/*" -x ".gradle/*"
      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SuperJet_Staff_v3.8.6_FULL_PROJECT_FINAL-${{ github.run_number }}
          path: |
            SuperJet_Staff_v3.8.6_FULL_PROJECT_FINAL.apk
            SuperJet_Staff_v3.8.6_ANDROID_SOURCE.zip
      - name: Publish APK release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v3.8.6-full-project-final-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG"             SuperJet_Staff_v3.8.6_FULL_PROJECT_FINAL.apk             SuperJet_Staff_v3.8.6_ANDROID_SOURCE.zip             --title "SuperJet Staff v3.8.6 Full Project Final (build ${GITHUB_RUN_NUMBER})"             --notes "Android app from the full project release: provider-aware payment notification details, manager-only seat statistics, decision-only booking queue, and current parser. Full Windows SuperJet project source is distributed separately."             --latest
