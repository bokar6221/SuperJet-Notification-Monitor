name: Build SuperJet Staff v2

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - release/v2.0-integrated-staff
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK
        shell: bash
        run: |
          SDKMANAGER="\${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -f "\$SDKMANAGER" ]; then
            echo "sdkmanager not found at \$SDKMANAGER"
            find "\${ANDROID_HOME}" -name sdkmanager -type f 2>/dev/null | head -20
            exit 1
          fi
          yes | "\$SDKMANAGER" --licenses || true
          "\$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Rename APK
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk SuperJet_Staff_v2.0.apk

      - name: Create source ZIP
        run: |
          zip -r SuperJet_Staff_v2.0_SOURCE.zip . \
            -x ".git/*" \
            -x "app/build/*" \
            -x ".gradle/*" \
            -x "SuperJet_Staff_v2.0.apk" \
            -x "SuperJet_Staff_v2.0_SOURCE.zip"

      - name: Upload release files
        uses: actions/upload-artifact@v4
        with:
          name: SuperJet_Staff_v2.0
          path: |
            SuperJet_Staff_v2.0.apk
            SuperJet_Staff_v2.0_SOURCE.zip
