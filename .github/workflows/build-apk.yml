name: Build SuperJet Staff v3.6.5 GUEST CODE 300 FINAL

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Build APK
        run: gradle :app:assembleDebug --no-daemon
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk SuperJet_Staff_v3.6.5_GUEST_CODE_300_FINAL.apk
      - name: Package source
        run: |
          zip -r SuperJet_Staff_v3.6.5_GUEST_CODE_300_FINAL_SOURCE.zip . -x ".git/*" -x "app/build/*" -x ".gradle/*"
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: SuperJet_Staff_v3.6.4_SUPPORT_PROOF_FINAL
          path: |
            SuperJet_Staff_v3.6.4_SUPPORT_PROOF_FINAL.apk
            SuperJet_Staff_v3.6.4_SUPPORT_PROOF_FINAL_SOURCE.zip

# V3.6.2 stable: operation center proof review + customer-service approval
