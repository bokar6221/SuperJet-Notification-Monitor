name: Build SuperJet Staff v3.7.0 Manager Seat Stats

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk SuperJet_Staff_v3.7.0_MANAGER_SEAT_STATS.apk

      - name: Package source
        run: |
          zip -r SuperJet_Staff_v3.7.0_MANAGER_SEAT_STATS_SOURCE.zip . -x ".git/*" -x "app/build/*" -x ".gradle/*"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SuperJet_Staff_v3.7.0_MANAGER_SEAT_STATS-${{ github.run_number }}
          path: |
            SuperJet_Staff_v3.7.0_MANAGER_SEAT_STATS.apk
            SuperJet_Staff_v3.7.0_MANAGER_SEAT_STATS_SOURCE.zip

      - name: Publish APK release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v3.7.0-manager-seat-stats-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" SuperJet_Staff_v3.7.0_MANAGER_SEAT_STATS.apk --title "SuperJet Staff v3.7.0 — Manager Seat Stats (build ${GITHUB_RUN_NUMBER})" --notes "Manager-only operational dashboard separates web booking requests, operations, issued ticket records, rejected operations, and actual seat counts. Requires the matching SuperJet backend endpoint to be deployed." --latest
