name: Build SuperJet Staff v3.5.2 FINAL PRO

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Build APK
        run: gradle :app:assembleDebug --no-daemon
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk SuperJet_Staff_v3.5.2_FINAL_PRO.apk
      - name: Package source
        run: |
          zip -r SuperJet_Staff_v3.5.2_FINAL_PRO_SOURCE.zip . -x ".git/*" -x "app/build/*" -x ".gradle/*"
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: SuperJet_Staff_v3.5.2_FINAL_PRO
          path: |
            SuperJet_Staff_v3.5.2_FINAL_PRO.apk
            SuperJet_Staff_v3.5.2_FINAL_PRO_SOURCE.zip

# V3.4 final tabs compile trigger
