name: Build SuperJet Staff v3.9.0 Instant Cached Booking Operations

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Android source
        uses: actions/checkout@v4
      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Build APK and unit-test task
        run: gradle :app:assembleDebug :app:testDebugUnitTest --no-daemon
      - name: Rename and verify APK
        run: |
          APK="SuperJet_Staff_v3.9.0_INSTANT_CACHED_BOOKING_OPERATIONS.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$APK"
          SIGNER="$(find "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$SIGNER"
          "$SIGNER" verify --verbose "$APK"
          unzip -t "$APK" >/dev/null
      - name: Package matching Android source
        run: |
          zip -r SuperJet_Staff_v3.9.0_ANDROID_SOURCE.zip . -x ".git/*" -x "app/build/*" -x ".gradle/*"
      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SuperJet_Staff_v3.9.0_INSTANT_CACHED_BOOKING_OPERATIONS-${{ github.run_number }}
          path: |
            SuperJet_Staff_v3.9.0_INSTANT_CACHED_BOOKING_OPERATIONS.apk
            SuperJet_Staff_v3.9.0_ANDROID_SOURCE.zip
      - name: Publish APK release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v3.9.0-instant-cached-booking-operations-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG"             SuperJet_Staff_v3.9.0_INSTANT_CACHED_BOOKING_OPERATIONS.apk             SuperJet_Staff_v3.9.0_ANDROID_SOURCE.zip             --title "SuperJet Staff v3.9.0 Instant Cached Booking Operations (build ${GITHUB_RUN_NUMBER})"             --notes "Android update: display last successful booking-operations list immediately from a compact local cache; refresh in background with one retry on timeout; improve staff GET timeout; keep stale items read-only until fresh state arrives; retain dual confirmation, official-ticket reconciliation, booking search, dark dialogs and fast proof-image view."             --latest
